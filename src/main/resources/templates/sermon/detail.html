<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common(title=${sermon.title} + ' - 샘물교회', description=null, keywords=null, ogTitle=null, ogDescription=null, includeKakaoMap=false)}"></th:block>
    <style>
        .sermon-detail-wrap {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }
        .sermon-detail-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .sermon-bible-tag {
            display: inline-block;
            padding: 4px 14px;
            background: #E6F1FB;
            color: #185FA5;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.04em;
            border-radius: 20px;
            border: 1px solid rgba(24,95,165,0.2);
        }
        .sermon-detail-date { font-size: 13px; color: #7A96B8; }
        .sermon-detail-title {
            font-family: 'Noto Serif KR', serif;
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 400;
            color: #0A1F3D;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .sermon-detail-preacher {
            font-size: 14px;
            color: #3A5278;
            font-weight: 300;
            margin-bottom: 28px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(24,95,165,0.1);
        }

        .sermon-video-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .sermon-video-wrap iframe,
        .sermon-video-wrap video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .sermon-audio-wrap { margin-bottom: 28px; }
        .sermon-audio-wrap audio { width: 100%; }

        .sermon-detail-desc {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.9;
            color: #3A5278;
            white-space: pre-line;
            margin-bottom: 36px;
        }

        .sermon-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #185FA5;
            text-decoration: none;
            font-size: 13px;
            font-weight: 300;
            border: 1px solid rgba(24,95,165,0.25);
            padding: 9px 20px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .sermon-back-btn:hover {
            background: #0D2B55;
            color: #fff;
            border-color: #0D2B55;
        }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/public :: siteNav('sermon')}"></th:block>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-hero-label">SERMON</div>
        <h1>설교 동영상</h1>
    </div>
</div>

<div class="breadcrumb">
    <div class="breadcrumb-inner">
        <a href="/">홈</a>
        <span class="breadcrumb-sep">›</span>
        <a href="/sermon">설교 동영상</a>
        <span class="breadcrumb-sep">›</span>
        <span th:text="${sermon.title}">제목</span>
    </div>
</div>

<div class="page-content">
    <div class="sermon-detail-wrap">

        <div class="sermon-detail-meta">
            <span class="sermon-bible-tag" th:text="${sermon.biblePassage}">성경본문</span>
            <span class="sermon-detail-date" th:text="${#temporals.format(sermon.sermonDate, 'yyyy년 M월 d일')}">날짜</span>
        </div>

        <h2 class="sermon-detail-title" th:text="${sermon.title}">설교 제목</h2>
        <p class="sermon-detail-preacher" th:text="${sermon.preacher}">설교자</p>

        <!-- YouTube 플레이어 -->
        <div class="sermon-video-wrap" th:if="${sermon.youtubeVideoId != null}">
            <iframe th:src="'https://www.youtube.com/embed/' + ${sermon.youtubeVideoId}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
        </div>

        <!-- 업로드 영상 플레이어 -->
        <div class="sermon-video-wrap" th:if="${sermon.uploadedFile and !sermon.audioFile}">
            <video th:src="${sermon.videoUrl}" th:poster="${sermon.thumbnailUrl}"
                   controls preload="metadata" playsinline></video>
        </div>

        <!-- 업로드 음성 플레이어 -->
        <div class="sermon-audio-wrap" th:if="${sermon.audioFile}">
            <audio th:src="${sermon.videoUrl}" controls preload="metadata"></audio>
        </div>

        <!-- 설교 설명 -->
        <div class="sermon-detail-desc"
             th:if="${sermon.description != null and !sermon.description.isEmpty()}"
             th:text="${sermon.description}"></div>

        <a href="/sermon" class="sermon-back-btn">← 목록으로 돌아가기</a>
    </div>
</div>

<th:block th:replace="~{fragments/public :: siteFooter}"></th:block>
</body>
</html>
