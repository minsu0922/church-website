<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common(title='교역자 소개 - 샘물교회', description=null, keywords=null, ogTitle=null, ogDescription=null, includeKakaoMap=false)}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/public :: siteNav('about-staff')}"></th:block>

<div class="page-hero">
    <div class="page-hero-inner">
        <div class="page-hero-label">STAFF</div>
        <h1>교역자 소개</h1>
        <p class="page-hero-sub">Meet Our Ministry Team</p>
    </div>
</div>

<div class="breadcrumb">
    <div class="breadcrumb-inner">
        <a href="/">홈</a>
        <span class="breadcrumb-sep">›</span>
        <a href="/about/church">교회 소개</a>
        <span class="breadcrumb-sep">›</span>
        <span>교역자 소개</span>
    </div>
</div>

<div class="page-content">
    <th:block th:if="${!#lists.isEmpty(staffList)}">
        <div class="person-card" th:each="s : ${staffList}">
            <div class="person-card-img" th:if="${s.photoUrl != null}">
                <img th:src="${s.photoUrl}" alt="교역자 사진"
                     style="width:100%;height:100%;object-fit:cover;border-radius:4px;"
                     onerror="this.parentElement.style.display='none'">
            </div>
            <div class="person-card-body">
                <div class="role" th:text="${s.role} ?: '교역자'">교역자</div>
                <h3 th:text="${s.name}">이름</h3>
                <p th:if="${!#strings.isEmpty(s.ministry)}"><strong>담당 사역:</strong> <span th:text="${s.ministry}"></span></p>
                <p th:if="${!#strings.isEmpty(s.bio)}" th:text="${s.bio}" style="white-space: pre-wrap;"></p>
            </div>
        </div>
    </th:block>
    <th:block th:if="${#lists.isEmpty(staffList)}">
        <div class="person-card">
            <div class="person-card-body">
                <div class="role">교역자</div>
                <h3>이름</h3>
                <p>소개 내용을 작성해주세요.</p>
            </div>
        </div>
    </th:block>
</div>

<th:block th:replace="~{fragments/public :: siteFooter}"></th:block>
</body>
</html>
