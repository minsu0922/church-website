# ===========================
# 운영 환경 전용 설정
# ===========================

# Thymeleaf 캐시 활성화 (운영 성능 향상)
spring.thymeleaf.cache=true

# JPA — 운영에서는 스키마 자동 변경 금지
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 파일 업로드 — 소스 디렉토리 외부로 분리 (재배포 시 파일 유실 방지)
file.upload.dir=/var/church/uploads/ministry
# Nginx가 /uploads/ 를 /var/church/uploads/ 에서 직접 서빙하므로 이 아래에 둬야 사진이 보인다
file.upload.people.dir=/var/church/uploads/people
file.upload.sermon.dir=/var/church/uploads/sermon

# Logging — 운영에서는 불필요한 로그 최소화
logging.level.root=WARN
logging.level.com.church.website=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
